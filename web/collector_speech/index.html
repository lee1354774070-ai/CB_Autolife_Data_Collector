<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>云蝶 · 采集播报</title><link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body><main>
<header><span class="brand">云蝶 / AUTOLIFE</span><span id="badge" class="badge">等待开启</span></header>
<section class="hero"><p class="eyebrow">COLLECTION VOICE</p><h1>采集状态，<br>听得到。</h1>
<p class="intro">直接用这台电脑播报。开启后可切回采集终端，保持本页打开。</p>
<div class="actions"><button id="start" class="primary">开启播报 <span>↗</span></button><button id="stop" disabled>停止播报</button></div>
<label class="voice-label" for="voice">本机中文声音</label><select id="voice"><option>正在加载声音…</option></select>
<p id="hint" class="hint" role="status">无需下载脚本或安装插件。首次使用请点击开启播报。</p></section>
<section class="status-card"><div class="card-label">当前采集反馈</div><p id="current" aria-live="polite">等待连接采集状态</p><p id="task" class="task">从采集终端打印的完整链接打开本页</p></section>
<section class="history"><h2>最近反馈 <span>按实际确认逐条播报</span></h2><ol id="events"></ol></section>
<footer>本页只播报，不控制机器人。关闭本页不会退出采集；保存、封口和退出仍在原终端或手柄操作。</footer>
</main></body></html>
